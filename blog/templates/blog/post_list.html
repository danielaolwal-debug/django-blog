{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Blog</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <header>
        <h1>My Blog</h1>
    </header>

    <main>
        {% for post in posts %}
            <article class="post">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content|truncatewords:30 }}</p>
<a href="{% url 'post_detail' post.pk %}">Read more &rarr;</a>
                <small>{{ post.created_at }}</small>
            </article>
        {% empty %}
            <p>No posts yet.</p>
        {% endfor %}
    </main>
</body>
</html>
